apply plugin: 'com.android.application'

android {
    namespace = "com.digitaltwin.taskmanager"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.digitaltwin.taskmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
}

apply from: 'capacitor.build.gradle'

def googleServicesApplied = false
try {
    def servicesJSON = file('google-services.json')
    if (!servicesJSON.exists()) {
        def altServices = [
            rootProject.file('google-services.json'),
            rootProject.file('../google-services.json'),
            rootProject.file('../public/google-services.json')
        ].find { it.exists() && it.length() > 0 }
        if (altServices != null) {
            servicesJSON.text = altServices.text
        }
    }
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        googleServicesApplied = true
    } else {
        logger.warn("google-services.json not found in android/app; using firebase-applet-config.json fallback resources")
    }
} catch (Exception e) {
    logger.warn("com.google.gms.google-services plugin skipped (${e.message}); using firebase-applet-config.json fallback resources")
}

def fallbackResDir = new File(layout.buildDirectory.get().asFile, "generated/res/firebase-fallback")
if (googleServicesApplied) {
    if (fallbackResDir.exists()) {
        fallbackResDir.deleteDir()
    }
} else {
    def appletConfigFile = rootProject.file('../firebase-applet-config.json')
    if (appletConfigFile.exists()) {
        def cfg = new groovy.json.JsonSlurper().parse(appletConfigFile)
        def valuesDir = new File(fallbackResDir, "values")
        valuesDir.mkdirs()
        def xmlEscape = { String s ->
            (s ?: '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
        }
        def xmlContent = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="default_web_client_id" translatable="false">${xmlEscape(cfg.oAuthClientId as String)}</string>
    <string name="gcm_defaultSenderId" translatable="false">${xmlEscape(cfg.messagingSenderId as String)}</string>
    <string name="google_api_key" translatable="false">${xmlEscape(cfg.apiKey as String)}</string>
    <string name="google_crash_reporting_api_key" translatable="false">${xmlEscape(cfg.apiKey as String)}</string>
    <string name="google_app_id" translatable="false">${xmlEscape(cfg.appId as String)}</string>
    <string name="google_storage_bucket" translatable="false">${xmlEscape(cfg.storageBucket as String)}</string>
    <string name="project_id" translatable="false">${xmlEscape(cfg.projectId as String)}</string>
</resources>
"""
        new File(valuesDir, "values.xml").write(xmlContent, "UTF-8")
        android.sourceSets.main.res.srcDir(fallbackResDir)
    }
}
