workflows:
  android-build:
    name: Build Android APK
    environment:
      node: latest
      java: 21
      vars:
        VITE_API_BASE: "https://digital-twin-v2-o9dw.onrender.com"
    scripts:
      - name: Install Dependencies
        script: npm install --legacy-peer-deps
      - name: Install Capacitor
        script: npm install @capacitor/cli @capacitor/android
      - name: Install Local Notifications
        script: npm install @capacitor/local-notifications
      - name: Build Web App
        script: npm run build
      - name: Sync Web Assets
        script: npx cap sync
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
