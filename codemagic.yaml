version: 2.1

scripts:
  pre-build: |
    rm -rf node_modules
    npm ci

  build-web-app: |
    esbuild server.ts --bundle --platform=node --format=esm --outfile=dist/server.cjs --external:fsevents --external:lightningcss

  build-android: |
    npm run build
    npx cap sync android
    cd android && ./gradlew assembleRelease

build:
  scripts:
    - pre-build
    - build-web-app
    - build-android
